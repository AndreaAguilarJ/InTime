# Project-wide Gradle settings.
# Enable support for AndroidX artifacts

android.useAndroidX=true
android.suppressUnsupportedCompileSdk=36
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Use Java 21 for Gradle (installed via Homebrew)
org.gradle.java.home=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home

# Kotlin Multiplatform: AGP 8.7.3 va por delante de la versión que el plugin de
# Kotlin declara como probada. La combinación funciona en este proyecto y el
# aviso se silencia para que no tape los avisos que sí importan.
kotlin.mpp.androidGradlePluginCompatibility.nowarn=true
